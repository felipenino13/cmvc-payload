services:
  payload:
    image: node:24.22.1-alpine

    working_dir: /home/node/app

    ports:
      - "8083:3000"

    volumes:
      - ./app:/home/node/app
      - node_modules:/home/node/app/node_modules

    env_file:
      - .env

    command: >
      sh -c "
      npm install &&
      npm run build &&
      npm run dev -- --hostname 0.0.0.0
      "

    restart: unless-stopped

volumes:
  node_modules: